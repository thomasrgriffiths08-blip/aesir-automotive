<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page not found — Æsir Automotive</title>
<meta name="robots" content="noindex">
<style>
/* self-contained — GitHub Pages serves this at any missing path, so no relative assets */
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0a0b0e;color:#ece9d6;font-family:'Archivo','Helvetica Neue',Arial,sans-serif;text-align:center;padding:24px}
.stripe{display:inline-flex;height:.82em;transform:skewX(-18deg);vertical-align:baseline;margin-right:0}
.stripe i{width:.3em;height:100%}
.stripe i:nth-child(1){background:#0a32f0}
.stripe i:nth-child(2){background:#2e2bb5}
.stripe i:nth-child(3){background:#e53122}
h1{font-weight:900;font-size:clamp(38px,8vw,84px);letter-spacing:.02em;text-transform:uppercase;line-height:1}
p{margin:18px 0 30px;color:#9aa3b2;font-size:16px}
.mono{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.3em;color:#5b6472;text-transform:uppercase;margin-bottom:14px}
a.btn{display:inline-block;background:#1032e8;color:#fff;font-weight:700;font-size:14px;letter-spacing:.05em;text-transform:uppercase;text-decoration:none;padding:15px 30px;clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%)}
a.btn:hover{background:#e53122;color:#fff}
</style>
</head>
<body>
<div>
  <div class="mono">Wrong turn</div>
  <h1><span class="stripe"><i></i><i></i><i></i></span>404</h1>
  <p>That page isn't on the ramp. The workshop's still open, though.</p>
  <a class="btn" id="home" href="/">Back to the site →</a>
</div>
<script>
/* point home at the site root whether we're on github.io/<repo>/ or a real domain */
var seg = location.pathname.split('/').filter(Boolean);
document.getElementById('home').href = (location.hostname.endsWith('github.io') && seg.length ? '/' + seg[0] + '/' : '/');
</script>
</body>
</html>
